# Pyprland configuration
# Generated by pypr-quickstart
# 2026-07-19 11:26:32 UTC

[pyprland]
plugins = ["scratchpads", "shortcuts_menu", "expose", "layout_center"]

[scratchpads]

[scratchpads.term]
animation = "fromBottom"
command = "alacritty --class scratchpad"
lazy = true
class = "scratchpad"
size = "75% 50%"
max_size = "1920px 100%"
position = "15% 25%"
margin = 70
preserve_aspect = true

[scratchpads.tomb]
animation = "fromBottom"
command = "foot -a scratchpad -e tmount.sh"
lazy = true
size = "50% 40%"
max_size = "1920px 100%"
position = "25% 55%"
margin = 50

[scratchpads.emacs]
animation = "fromTop"
command = "emacs"
class = "Emacs"
lazy = true

[shortcuts_menu]
engine = "fuzzel"
command_start = "💀 "

[shortcuts_menu.entries]
tombs = "pypr toggle tomb"
mount = "hypr-scratchpads fzmount"
clipboard = [
  { name = "entry", command = "cliphist list", filter = "s/	.*//" },
  "cliphist decode '[entry]' | wl-copy"
]

[layout_center]
margin = 0
